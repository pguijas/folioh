name: Deploy Docs

"on":
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit to publish at the site root"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: >-
      ${{ github.event.repository.private &&
          (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
          fromJSON('["self-hosted", "nas"]') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: production-source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
      pull-requests: read
    steps:
      - name: Clear job workspace
        shell: bash
        working-directory: ${{ github.workspace }}
        run: rm -rf -- "${GITHUB_WORKSPACE:?}/production-source"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: production-source
          fetch-depth: 0

      - name: Record deployment source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: production-source
          cache-bin: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build folioh
        run: |
          cargo build --release --locked -p folioh-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Build docs
        env:
          FOLIOH_BASE_PATH: "${{ steps.pages.outputs.base_path || '/' }}"
          FOLIOH_PREVIEW_URL: ${{ github.event.repository.private && steps.pages.outputs.base_url || '' }}
        run: folioh build --clean

      - name: Preserve branch previews
        shell: bash
        run: folioh github-pages preserve-previews --site-dir _site --git-repo . --state-dir _pages-state --state-branch folioh-pages-state

      - name: Prune stale previews
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_prs="$(gh pr list --state open --json number,headRefName)"
          folioh github-pages prune-previews \
            --previews-dir _site/previews \
            --open-prs-json "$open_prs"

      - name: Write previews data
        shell: bash
        run: folioh github-pages write-previews-data --previews-dir _site/previews

      - name: Save Pages state
        shell: bash
        run: folioh github-pages save-state --artifact-dir _site --git-repo . --state-dir _pages-state --state-branch folioh-pages-state --commit-message "Update Pages state"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production-source/_site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_SHA: ${{ steps.source.outputs.sha }}

      - name: Verify and print deployment URL
        shell: bash
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          index_url="${url%/}/previews/"
          folioh github-pages verify-url \
            --url "$url" \
            --index-url "$index_url" \
            --summary-heading "Production docs" \
            --primary-label "Production URL" \
            --index-label "Previews index" \
            --success-message "Verified deployment and previews index with HTTP 200." \
            --error-message "Deployment URL or previews index did not return HTTP 200"

      - name: Remove consumed temporary artifacts
        if: success() && steps.deployment.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Only this run's consumed intermediates; releases and Pages stay published.
            const { owner, repo } = context.repo
            const names = new Set(['github-pages'])
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, per_page: 100
            })
            for (const artifact of artifacts) {
              if (!names.has(artifact.name)) continue
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id })
                core.info(`Removed temporary artifact ${artifact.name} (${artifact.id})`)
              } catch (error) {
                if (error.status !== 404) throw error
              }
            }
