name: rust

# A `v*` tag runs these checks through release.yml, which calls this workflow.
on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  workflow_call:

jobs:
  lint:
    runs-on: >-
      ${{ github.event.repository.private &&
          (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
          fromJSON('["self-hosted", "nas"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages tools on the private runner
        if: runner.environment == 'self-hosted'
        run: |
          gh --version
          jq --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: ${{ runner.environment == 'github-hosted' }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - name: template dependencies
        working-directory: template
        run: pnpm install --frozen-lockfile
      - name: template lint
        working-directory: template
        run: pnpm lint
      - name: template typecheck
        working-directory: template
        run: pnpm typecheck
      # A theme package's theme/project-theme.ts may export an untyped
      # literal that sets only some keys; the bundled configurator must still
      # type-check against it. Last step: it rewrites a tracked file.
      - name: template typecheck against an untyped package default
        working-directory: template
        run: |
          cat > theme/project-theme.ts <<'EOF'
          import type { ThemePreset } from "./preset-types"

          export const projectThemePreset: ThemePreset | null = null

          export const projectThemeDefaultConfig = {
            customization: { fontId: "geist", colorId: "ink" },
          }
          EOF
          pnpm typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        # Temporarily paused: restore macos-latest and its required check together.
        os: [ubuntu-latest]
    # Keep the matrix labels: branch protection requires these check names.
    runs-on: >-
      ${{ github.event.repository.private && matrix.os == 'ubuntu-latest' &&
          (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
          fromJSON('["self-hosted", "nas"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: ${{ runner.environment == 'github-hosted' }}
      # 22, not the documented 20.19 floor: the template's TypeScript helpers
      # are driven directly by Node in folioh-site's tests, and older releases
      # skip them instead of asserting.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - name: test
        run: cargo test --workspace --locked
  # Temporarily paused: uncomment this job and restore its required check together.
  # windows:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - uses: Swatinem/rust-cache@v2
  #     - name: the shipped CLI surface
  #       run: cargo test -p folioh-cli --test cli_surface --locked

  real-export:
    runs-on: >-
      ${{ github.event.repository.private &&
          (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) &&
          fromJSON('["self-hosted", "nas"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      # The two suites that run real pnpm and next build; ignored by default
      # because they cost minutes and the network.
      - name: the example site exports
        run: cargo test -p folioh-site --test e2e_export --locked -- --ignored --nocapture
      - name: the binary exports the example site
        run: cargo test -p folioh-cli --test build_pipeline --locked -- --ignored --nocapture
